# fn176 deployment for the CoA server image built by
# .github/workflows/coa-linux-image.yml (ghcr.io/callmefree/coa-server).
#
# Layout on the host (/vol1/1000/docker/coa-fn176):
#   docker-compose.yml  this file
#   .env                secrets + image tag    (not committed)
#   config/             worldserver.conf, authserver.conf, dbimport.conf, modules/
#   data/               game data (symlink -> root/Data): dbc/ maps/ vmaps/ mmaps/ Cameras/
#   logs/               server logs, bind mount (must be writable by uid 1000)
#   botcmd.sh           drive the worldserver console (docker attach through a PTY)
#
# Start:   docker compose up -d                       # authserver + worldserver (+ database)
# Console: ./botcmd.sh "botcmd spawnleveled 200"
# dbimport: docker compose run --rm coa-db-import     # only for a from-scratch build, see README
#
# NOTE: coa-db-import is behind the "tools" profile on purpose. The official CoA
# distribution does not replay the core SQL chain into an empty database (the chain
# contains updates that no longer match the current module base schema), so the
# supported database source is the pre-built dump that ships with the official
# install-base package -- see README.md ("Database"). dbimport stays available for
# experiments, but must not gate authserver/worldserver startup.

name: coa

x-server-env: &server-env
  AC_DATA_DIR: /azerothcore/env/dist/data
  AC_LOGS_DIR: /azerothcore/env/dist/logs
  AC_TEMP_DIR: /azerothcore/env/dist/temp
  AC_LOGIN_DATABASE_INFO: "coa-database;3306;root;${COA_DB_ROOT_PASSWORD};acore_auth"
  AC_WORLD_DATABASE_INFO: "coa-database;3306;root;${COA_DB_ROOT_PASSWORD};acore_world"
  AC_CHARACTER_DATABASE_INFO: "coa-database;3306;root;${COA_DB_ROOT_PASSWORD};acore_characters"

services:
  coa-database:
    image: mysql:8.4
    container_name: coa-database
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${COA_DB_ROOT_PASSWORD:?set COA_DB_ROOT_PASSWORD in .env}
    volumes:
      - coa-db-data:/var/lib/mysql
    ports:
      - "${COA_DB_EXTERNAL_PORT:-3307}:3306"
    networks: [coa]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # Expert/experimental path only (profile "tools"): builds the three databases from
  # the SQL baked into the image (core data/sql + every module's data/sql).
  coa-db-import:
    profiles: ["tools"]
    image: ${COA_IMAGE:-ghcr.io/callmefree/coa-server:latest}
    container_name: coa-db-import
    restart: "no"
    command: ["dbimport"]
    environment:
      <<: *server-env
      ACORE_COMPONENT: dbimport
      AC_FORCE_CREATE_DB: "1"
      AC_DISABLE_INTERACTIVE: "1"
    volumes:
      - ./config:/azerothcore/env/dist/etc
      - ./logs:/azerothcore/env/dist/logs
    depends_on:
      coa-database:
        condition: service_healthy
    networks: [coa]

  coa-authserver:
    image: ${COA_IMAGE:-ghcr.io/callmefree/coa-server:latest}
    container_name: coa-authserver
    restart: unless-stopped
    command: ["authserver"]
    environment:
      <<: *server-env
      ACORE_COMPONENT: authserver
    volumes:
      - ./config:/azerothcore/env/dist/etc
      - ./logs:/azerothcore/env/dist/logs
    ports:
      - "${COA_AUTH_EXTERNAL_PORT:-3724}:3724"
    depends_on:
      coa-database:
        condition: service_healthy
    networks: [coa]
    # Liveness = "the login port answers". Docker alone only stops on crash, so
    # watchdog.sh (host cron, every 2 min) restarts containers that go unhealthy.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/3724"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  coa-worldserver:
    image: ${COA_IMAGE:-ghcr.io/callmefree/coa-server:latest}
    container_name: coa-worldserver
    restart: unless-stopped
    command: ["worldserver"]
    stdin_open: true
    tty: true
    # AzerothCore saves characters on SIGTERM: give it time before the SIGKILL.
    stop_grace_period: 60s
    environment:
      <<: *server-env
      ACORE_COMPONENT: worldserver
    volumes:
      - ./config:/azerothcore/env/dist/etc
      - ./logs:/azerothcore/env/dist/logs
      - ./data:/azerothcore/env/dist/data:ro
    ports:
      - "${COA_WORLD_EXTERNAL_PORT:-8085}:8085"
      - "${COA_SOAP_EXTERNAL_PORT:-7878}:7878"
      - "${COA_RA_EXTERNAL_PORT:-3443}:3443"
    depends_on:
      coa-database:
        condition: service_healthy
    networks: [coa]
    # The world port only opens after the world is fully initialised (~20 s), so
    # start_period covers that; a hung-but-alive worldserver fails the probe and
    # watchdog.sh restarts it.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8085"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s

  # Player registration site: the service that used to run on the old server
  # (192.168.1.89, C:\COA\CoA-Repack\WebRegister). It talks to MySQL directly and
  # writes SRP6 salt/verifier into acore_auth.account, so accounts it creates exist
  # on THIS realm. Source lives in ./webregister (Dockerfile + context/).
  coa-register:
    image: coa-register:local
    build:
      context: ./webregister
    container_name: coa-register
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      # mount the settings instead of baking them into the image, so the db
      # credentials / realm address can change without a rebuild
      - ./webregister/context/Settings:/app/Settings:ro
    ports:
      - "${COA_REGISTER_EXTERNAL_PORT:-8090}:8090"
    depends_on:
      coa-database:
        condition: service_healthy
    networks: [coa]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # frp client (profile "tunnel"): publishes the register site as
  # soulcore.asia:<COA_FRP_REGISTER_REMOTE_PORT> so players keep using
  # https://register.soulcore.asia. off until the cutover.
  # The image is built locally from the official frp v0.71.0 linux binary
  # (matches the frps version on the VPS) because Docker Hub pulls on fn176
  # crawl: see frpc-build/Dockerfile + build-frpc.sh.
  coa-frpc:
    profiles: ["tunnel"]
    image: coa-frpc:local
    container_name: coa-frpc
    restart: unless-stopped
    volumes:
      - ./frpc.toml:/etc/frp/frpc.toml:ro
    depends_on: [coa-register]
    networks: [coa]

volumes:
  coa-db-data:
  coa-logs:

networks:
  coa:
    name: coa
