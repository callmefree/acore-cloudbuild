# Extra [worldserver] keys for the CoA fork.
#
# The fork reads ~100 options from the worldserver config that neither its own
# worldserver.conf.dist nor the 35 bundled modules ship, so every server start logs
# one "Config: Missing property <key> ... add \"<key> = <value>\"" line per option.
#
# EVERY value below is copied verbatim from those log lines, i.e. it is the default
# the core already falls back to when the key is absent.  Adding them is therefore
# behaviour-neutral: nothing changes except that the ~140 warning lines per start
# disappear and the effective defaults become visible and tunable in one place.
# Adjust values here (not in the image) and restart the worldserver to take effect.
#
# deploy.sh merges this file into config/worldserver.conf inside the [worldserver]
# section; it is idempotent (a key already present is left untouched).

# --- CoA core ---------------------------------------------------------------
CoA.Enable = 1
CoA.ClassModel = coa
CoA.RealmType = live
CoA.RulesetLoginDefault = 1
CoA.GameModeMask = 0

# --- client / opcode plumbing ----------------------------------------------
# NOT behaviour-neutral, unlike every other key in this file: the core enables the
# Ascension/CoA client compatibility path (extension opcode range below) only when the
# remote address is loopback OR this key is true (WorldSocket.cpp:117-141,
# `allowAscensionClient = GetRemoteIpAddress().is_loopback() || CoA.AllowRemoteClients`).
# Players reach this server through the coa-frpc container, so their source IP is never
# loopback and the CoA client's extension headers would be rejected as malformed packets
# ("WorldSocket::ReadHeaderHandler(): client 172.26.0.6 sent malformed packet") which the
# client shows as "connected"/"connection to the server failed" right after login.
# Must stay 1 as long as the world port is reached via the tunnel.
CoA.AllowRemoteClients = 1
CoA.FirstExtensionOpcode = 1311
CoA.LastExtensionOpcode = 2515
CoA.SendDisplayPatches = 1
CoA.LogConsumedPackets = 1
CoA.ClientBooleanConfigs = ""
CoA.ClientIntegerConfigs = ""
CoA.ClientDbcDirectory = ""

