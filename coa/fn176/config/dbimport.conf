# dbimport configuration for the CoA Docker deployment.
#
# Only the keys that differ from the built-in defaults are listed; every other
# value keeps its compiled-in default.  The database connection strings are
# overridden at runtime by AC_LOGIN_DATABASE_INFO / AC_WORLD_DATABASE_INFO /
# AC_CHARACTER_DATABASE_INFO in docker-compose.yml.

LogsDir = "/azerothcore/env/dist/logs"
TempDir = "/azerothcore/env/dist/temp"

# Empty = use the source directory compiled into dbimport (/azerothcore), where the
# image keeps the core SQL tree and every module's SQL tree.
SourceDirectory = ""

# 7 = auth + characters + world, and apply the SQL shipped by every module
# (credentials_codex, dynamic_xp, CoA challenges, CoA Bots, ...).
Updates.EnableDatabases = 7
Updates.AllowedModules = "all"
Updates.AutoSetup = 1
Updates.Redundancy = 1
Updates.ArchivedRedundancy = 0
Updates.AllowRehash = 1
Updates.CleanDeadRefMaxCount = 3

Appender.Console = 1,5,0,"1 9 3 6 5 8"
Appender.DBImport = 2,5,0,DBImport.log,w
Logger.root = 4,Console DBImport
