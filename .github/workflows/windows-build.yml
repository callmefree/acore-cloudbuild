# =============================================================================
#  AzerothCore (WotLK) Windows 云编译工作流
# -----------------------------------------------------------------------------
#  放在我们自己的空仓库（默认 acore-cloudbuild）里，工作流自己去 checkout
#  上游 azerothcore/azerothcore-wotlk@master 编译。
#
#  为什么不 fork 上游：
#    GitHub 每个账号在同一 fork 网络里只允许一个 fork。该账号已有
#    azerothcore-wotlk-playerbot，再 POST /forks 只会返回那个既有仓库。
#    改为"自有仓库 + checkout 上游"后，每次编的都是上游最新 master，
#    且不产生 fork 同步负担。
#
#  触发：仅 workflow_dispatch（由 trigger_build.ps1 经 API 触发）。
#    不挂 push：本仓库用 Contents API 提交文件，挂 push 会与 dispatch
#    产生重复 run，第二个 run 发布 Release 时会撞同名 tag。
#
#  产物布局（zip 根）：
#    bin/       worldserver.exe / authserver.exe / *.dll / tools / lua_scripts/
#    etc/       worldserver.conf.dist / authserver.conf.dist / dbimport.conf.dist
#               + modules/*.conf.dist
#    sql/       data/sql/base + data/sql/updates（本机 setup_db.ps1 直接导入）
#    modules/   模块源码树（含 data/sql，供模块更新器与手工导入）
#
#  关键路径依据（AC master）：
#    conf/dist/config.sh             : BINPATH="$AC_PATH_ROOT/env/dist"
#    apps/bash_shared/includes.sh    : AC_BINPATH_FULL="$BINPATH/bin"
#    → 二进制在 env/dist/bin，配置在 env/dist/etc
#
#  注意：模块目录名必须原样（决定 mod_xxx_loader 链接符号），禁止改名。
# =============================================================================
name: windows-build

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # 仅用于发布 Release

env:
  AC_DIR: ac        # 上游 AzerothCore 检出到的子目录

jobs:
  windows-build:
    runs-on: windows-latest
    name: windows-latest
    env:
      BOOST_ROOT: C:\local\boost_1_87_0
      # 静态模块/脚本：全部编进 worldserver.exe，部署侧不再处理 .dll 加载路径
      CSCRIPTS: static
      CMODULES: static
      # PCH 必须保持 ON（AC conf/dist/config.sh 默认就是 ON）。
      # 实测关掉后 MSVC 直接编译失败：src/common 里一批头文件依赖 core PCH 提供
      # <string>、M_PI、ASSERT —— 表现为
      #   OpenSSLCrypto.cpp: 'ASSERT': identifier not found
      #   Geometry.h: 'M_PI': undeclared identifier
      #   Tokenize.h: 'std::string' is not a member of 'std'
      # 不要为了"加速"关它。
      CCOREPCH: ON
      CSCRIPTPCH: ON
      # mod-ale：AC 的 modules/CMakeLists.txt 对其有专门分支（MOD_ALE_FOUND），
      # 静态编入时把 lualib 链进 modules 目标，并把 LuaEngine/extensions
      # 安装到 bin/lua_scripts/。Lua 由 ALE 在 CMake configure 期用
      # FetchContent 从 lua.org 下载（不是仓库自带源码），runner 有外网即可。
      # 默认 LUA_VERSION=lua52。
    steps:
      # 1) 本仓库：提供 ci/modules.list
      - name: Checkout build repo
        uses: actions/checkout@v7
        with:
          path: buildrepo

      # 2) 上游 AzerothCore master
      - name: Checkout AzerothCore master
        uses: actions/checkout@v7
        with:
          repository: azerothcore/azerothcore-wotlk
          ref: master
          path: ac

      - name: Record AC commit
        shell: bash
        run: |
          set -euo pipefail
          SHA="$(git -C ac rev-parse HEAD)"
          SHORT="${SHA:0:7}"
          echo "AC_SHA=$SHA"        >> "$GITHUB_ENV"
          echo "AC_SHA_SHORT=$SHORT" >> "$GITHUB_ENV"
          echo "### AzerothCore master @ $SHORT" >> "$GITHUB_STEP_SUMMARY"

      - name: Cache Boost & MySQL
        uses: actions/cache@v6
        with:
          path: |
            C:\local\boost_1_87_0
            C:\tools\mysql\current
          key: winbuild-deps:boost-1.87.0:mysql-8.4.9

      - name: Configure OS (Boost / MySQL / OpenSSL)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # --- Boost 1.87.0 (msvc-14.3, 64-bit) -> C:\local\boost_1_87_0 (BOOST_ROOT) ---
          if (-not (Test-Path 'C:\local\boost_1_87_0\boost'))
          {
              $boostExe = Join-Path $env:RUNNER_TEMP 'boost.exe'
              $boostUrl = 'https://downloads.sourceforge.net/project/boost/boost-binaries/' +
                  '1.87.0/boost_1_87_0-msvc-14.3-64.exe'
              # SourceForge 按 UA 分派：浏览器 UA 会拿到 HTML 页面，故用非浏览器 UA
              $boostRequest = @{
                  Uri                      = $boostUrl
                  OutFile                  = $boostExe
                  UserAgent                = 'azerothcore-ci'
                  ConnectionTimeoutSeconds = 60
                  OperationTimeoutSeconds  = 60
              }
              $boostAttempts = 3
              for ($attempt = 1; $attempt -le $boostAttempts; $attempt++)
              {
                  try
                  {
                      Invoke-WebRequest @boostRequest
                      $boostMB = (Get-Item $boostExe).Length / 1MB
                      if ($boostMB -lt 50) { throw "got $([int]$boostMB) MB, likely an HTML page." }
                      break
                  }
                  catch
                  {
                      Write-Host "Boost download attempt $attempt failed: $($_.Exception.Message)"
                      if ($attempt -eq $boostAttempts) { throw }
                      Start-Sleep -Seconds 15
                  }
              }
              Write-Host ("Downloaded Boost installer: {0:N1} MB" -f $boostMB)
              $boostProc = Start-Process -FilePath $boostExe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/DIR=C:\local\boost_1_87_0' -Wait -PassThru
              if ($boostProc.ExitCode -ne 0) { throw "Boost installer failed with exit code $($boostProc.ExitCode)." }
              if (-not (Test-Path 'C:\local\boost_1_87_0\boost\version.hpp')) { throw 'Boost install missing headers.' }
              if (-not (Test-Path 'C:\local\boost_1_87_0\lib64-msvc-14.3')) { throw 'Boost install missing prebuilt libs.' }
          }

          # --- MySQL 8.4 client headers + libs -> C:\tools\mysql\current ---
          if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib'))
          {
              $mysqlZip = Join-Path $env:RUNNER_TEMP 'mysql.zip'
              Invoke-WebRequest -Uri 'https://cdn.mysql.com/archives/mysql-8.4/mysql-8.4.9-winx64.zip' -OutFile $mysqlZip -UserAgent 'Mozilla/5.0'
              $mysqlMB = (Get-Item $mysqlZip).Length / 1MB
              Write-Host ("Downloaded MySQL zip: {0:N1} MB" -f $mysqlMB)
              if ($mysqlMB -lt 50) { throw "MySQL zip download looks wrong ($([int]$mysqlMB) MB)." }
              New-Item -ItemType Directory -Force -Path 'C:\tools\mysql' | Out-Null
              Expand-Archive -Path $mysqlZip -DestinationPath 'C:\tools\mysql' -Force
              if (Test-Path 'C:\tools\mysql\current') { Remove-Item -Recurse -Force 'C:\tools\mysql\current' }
              Rename-Item 'C:\tools\mysql\mysql-8.4.9-winx64' 'C:\tools\mysql\current'
              if (-not (Test-Path 'C:\tools\mysql\current\lib\mysqlclient.lib')) { throw 'MySQL client import library missing.' }
          }

          # --- OpenSSL: 使用 runner 镜像自带的安装 ---
          $opensslRoot = @($env:OPENSSL_ROOT_DIR, 'C:\Program Files\OpenSSL', 'C:\Program Files\OpenSSL-Win64') |
              Where-Object { $_ -and (Test-Path (Join-Path $_ 'include\openssl\opensslv.h')) } |
              Select-Object -First 1
          if (-not $opensslRoot) { throw 'No OpenSSL development install found on the runner image.' }
          "OPENSSL_ROOT_DIR=$opensslRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using OpenSSL at $opensslRoot"

      - name: Clone enabled modules from ci/modules.list
        shell: bash
        working-directory: ac
        run: |
          set -euo pipefail
          MODULES_LIST="../buildrepo/ci/modules.list"
          if [ ! -f "$MODULES_LIST" ]; then
            echo "::error::ci/modules.list not found (expected at $MODULES_LIST)."
            exit 1
          fi
          mkdir -p modules
          while IFS='|' read -r dir repo branch enabled; do
            dir="$(echo "$dir" | xargs)"; repo="$(echo "$repo" | xargs)"
            branch="$(echo "$branch" | xargs)"; enabled="$(echo "$enabled" | xargs)"
            [ -z "$dir" ] && continue
            case "$dir" in \#*) continue ;; esac
            [ "$enabled" != "1" ] && { echo "SKIP (disabled): $dir"; continue; }
            # 解析自检：仓库必须是 http(s):// 或 git@ 开头，错了立刻炸而不是拿到半个 URL
            case "$repo" in
              http://*|https://*|git@*) ;;
              *) echo "::error::bad repo spec for $dir: '$repo'"; exit 1 ;;
            esac
            rm -rf "modules/$dir"
            # 只有 "<url>.git:<子目录>" 才算多模块大仓。
            # 不能简单用 ==*:* 判断——普通 https://... 里也有冒号，会把 "https" 当成仓库名。
            if [[ "$repo" =~ ^(https?://[^:]+\.git):(.+)$ ]]; then
              mrepo="${BASH_REMATCH[1]}"; sub="${BASH_REMATCH[2]}"
              tmp="$(mktemp -d)"
              echo "CLONE monorepo $mrepo @$branch -> extract '$sub' as $dir"
              git clone --depth 1 --branch "$branch" "$mrepo" "$tmp/repo"
              if [ ! -d "$tmp/repo/$sub" ]; then
                echo "::error::subdir '$sub' not found in $mrepo"; exit 1
              fi
              cp -r "$tmp/repo/$sub" "modules/$dir"
              rm -rf "$tmp"
            else
              echo "CLONE $repo @$branch -> modules/$dir"
              git clone --depth 1 --branch "$branch" "$repo" "modules/$dir"
            fi
            # --- 本地补丁（ci/patches/<模块目录名>__*.patch）---------------------------
            # 用途：上游模块尚未适配当前 AC master 时，在 clone 之后、configure/build 之前
            # 就地修正。应用失败直接 fail，避免"以为编进去了其实还是坏代码"。
            # 必须放在 rm -rf .git 之前——git apply 需要仓库上下文。
            # 注意：git -C <模块目录> 会把相对路径按模块目录解析，所以补丁目录必须先转成绝对路径。
            PATCHDIR="../buildrepo/ci/patches"
            if [ -d "$PATCHDIR" ]; then
              PATCHDIR="$(cd "$PATCHDIR" && pwd)"
              for p in "$PATCHDIR/$dir"__*.patch; do
                [ -f "$p" ] || continue
                echo "PATCH $(basename "$p") -> modules/$dir"
                if ! git -C "modules/$dir" apply --ignore-whitespace --whitespace=nowarn "$p"; then
                  echo "::error::failed to apply patch $(basename "$p") on modules/$dir"
                  exit 1
                fi
              done
            fi
            # 去掉 .git，避免打进产物
            rm -rf "modules/$dir/.git"
          done < "$MODULES_LIST"
          echo "---- modules/ ----"
          ls -1 modules

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          export CTOOLS_BUILD=all
          cd ac
          ./acore.sh compiler build

      - name: Package artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ac    = Join-Path $env:GITHUB_WORKSPACE 'ac'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'artifacts/AzerothCore-Win64'
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          # 复制约定：先 New-Item 建好目标目录，再**逐项** Copy-Item。
          # 不能用 Copy-Item '<src>\*' <dst> -Recurse：源里既有文件又有子目录时，
          # PowerShell 会先把 <dst> 当叶子（文件）建出来，随后复制目录就报
          # "Container cannot be copied onto existing leaf item"（已实测踩坑）。
          function Copy-Into([string]$src, [string]$dst) {
              New-Item -ItemType Directory -Force -Path $dst | Out-Null
              Get-ChildItem -LiteralPath $src -Force | ForEach-Object {
                  Copy-Item -LiteralPath $_.FullName -Destination $dst -Recurse -Force
              }
          }
          $skipExt = @('.pdb','.ilk','.exp','.lib','.obj')

          # 0) 诊断：看看 env/dist 到底长什么样（安装前缀行为可能与文档不一致）
          $dist = Join-Path $ac 'env/dist'
          if (Test-Path $dist) {
              Write-Host 'env/dist layout:'
              Get-ChildItem -LiteralPath $dist -Force | ForEach-Object { Write-Host ("  {0}" -f $_.Name) }
          } else { Write-Host 'env/dist not present' }

          # 1) 二进制：优先 env/dist/bin，找不到就在 ac/ 下全搜（跳过 artifacts）
          $srcBin = Join-Path $ac 'env/dist/bin'
          if (-not (Test-Path (Join-Path $srcBin 'worldserver.exe'))) {
              $hit = Get-ChildItem $ac -Recurse -Filter 'worldserver.exe' -File -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notmatch '\\artifacts\\' } | Select-Object -First 1
              if (-not $hit) { throw "worldserver.exe not found under $ac. Build output layout changed?" }
              $srcBin = $hit.DirectoryName
              Write-Host "::warning::fallback bin dir: $srcBin"
          }
          Write-Host "bin source: $srcBin"
          $dstBin = Join-Path $stage 'bin'
          New-Item -ItemType Directory -Force -Path $dstBin | Out-Null
          Get-ChildItem -LiteralPath $srcBin -Force | Where-Object { $skipExt -notcontains $_.Extension.ToLower() } |
              ForEach-Object { Copy-Item -LiteralPath $_.FullName -Destination $dstBin -Recurse -Force }
          if (-not (Test-Path (Join-Path $stage 'bin/worldserver.exe'))) { throw 'worldserver.exe missing after copy' }
          if (-not (Test-Path (Join-Path $stage 'bin/authserver.exe')))  { throw 'authserver.exe missing after copy' }

          # 2) 运行期依赖（一）：libmysql.dll
          #
          # 必须用**编译期实际那一套** MySQL 的 DLL。AC 启动时会比对
          #   mysql_get_client_version()（运行期 DLL） vs MYSQL_VERSION_ID（编译期头文件）
          # 不一致就直接 FATAL：ACE00046 "... does not match the version id used to compile
          # AzerothCore"。实测踩坑：本 job 虽然预下载了 MySQL 8.4.9，但 acore.sh 自动探测
          # 时命中了 runner 镜像自带的 MySQL 8.0.46（编译期 80046），旧版此处却盲目复制
          # C:\tools\mysql\current 的 8.4.9 DLL（80409）-> 产物在目标机启动即 ACE00046 秒退。
          #
          # 所以：先读 CMakeCache.txt 回溯编译期实际使用的 MySQL，再取它的 libmysql.dll。
          $cacheTxt = ''
          $cacheFile = Get-ChildItem $ac -Recurse -Filter 'CMakeCache.txt' -ErrorAction SilentlyContinue |
              Where-Object { -not $_.PSIsContainer -and $_.FullName -notmatch '\\artifacts\\' } | Select-Object -First 1
          if ($cacheFile) { $cacheTxt = Get-Content $cacheFile.FullName -Raw; Write-Host "CMakeCache: $($cacheFile.FullName)" }

          # CMakeCache.txt 的行格式是 VARNAME:TYPE=VALUE，取值时必须把 ":TYPE=" 整段剥掉。
          # 踩坑记录：早先的正则只吃掉了 ":" 而留下 "TYPE="，于是拿到 "PATH=C:/Program Files/..."
          # 这种畸形路径；随后 Get-ChildItem 因 PSDrive "PATH=C" 不存在而走不到 FileSystem 提供程序，
          # 动态参数 -File 直接消失，报 "A parameter cannot be found that matches parameter name 'File'"。
          # 因此这里改为：整行解析成哈希表 + 一律 -LiteralPath + 用 PSIsContainer 过滤目录。
          $cc = @{}
          if ($cacheTxt) {
              foreach ($line in ($cacheTxt -split "`r?`n")) {
                  if ($line -match '^\s*([^#=\s][^=]*?)=(.*)$') { $cc[$matches[1].Trim()] = $matches[2].Trim() }
              }
          }
          $libCands = @(); $incCands = @()
          foreach ($k in $cc.Keys) {
              $v = ($cc[$k] -split ';')[0].Trim().Trim('"')
              if (-not $v) { continue }
              if ($k -match 'MYSQL' -and $k -match 'LIB'     -and $v -match 'mysqlclient\.lib') { $libCands += $v }
              if ($k -match 'MYSQL' -and $k -match 'INCLUDE' -and $v -match '[\\/]include')      { $incCands += $v }
          }
          # 多候选时优先选磁盘上真实存在的那个
          $libPath = @($libCands | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1)[0]
          $incDir  = @($incCands | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1)[0]
          if (-not $libPath) { $libPath = $libCands[0] }
          if (-not $incDir)  { $incDir  = $incCands[0] }
          Write-Host "compile-time MySQL lib  : $libPath"
          Write-Host "compile-time MySQL inc  : $incDir"

          # 在候选根目录下找 libmysql.dll：优先 <root>\lib\libmysql.dll，其次递归。
          function Find-LibMysql([string]$root) {
              if (-not $root -or -not (Test-Path -LiteralPath $root)) { return $null }
              $direct = Join-Path $root 'lib\libmysql.dll'
              if (Test-Path -LiteralPath $direct) { return (Get-Item -LiteralPath $direct) }
              return (Get-ChildItem -LiteralPath $root -Recurse -Filter 'libmysql.dll' -ErrorAction SilentlyContinue |
                      Where-Object { -not $_.PSIsContainer } | Select-Object -First 1)
          }

          $libmysql = $null
          if ($libPath) {
              # .../<mysqlRoot>/lib/mysqlclient.lib -> <mysqlRoot>
              $libmysql = Find-LibMysql (Split-Path (Split-Path $libPath -Parent) -Parent)
          }
          if (-not $libmysql -and $incDir) {
              # 头文件目录 .../<mysqlRoot>/include -> <mysqlRoot>
              $libmysql = Find-LibMysql (Split-Path $incDir -Parent)
          }
          if (-not $libmysql) {
              Write-Host '::warning::could not locate compile-time libmysql.dll from CMakeCache; falling back to C:\tools\mysql\current'
              $libmysql = Find-LibMysql 'C:\tools\mysql\current'
          }
          if (-not $libmysql) { throw 'libmysql.dll not found - 产物将无法启动（ACE00046 或缺 DLL）' }
          Copy-Item -LiteralPath $libmysql.FullName -Destination $dstBin -Force
          $dllVer = (Get-Item (Join-Path $dstBin 'libmysql.dll')).VersionInfo.ProductVersion
          Write-Host ("packaged libmysql.dll {0}  <- {1}" -f $dllVer, $libmysql.FullName)

          # 硬校验：编译期 MYSQL_VERSION_ID 与 DLL 版本必须一致；不一致直接 fail，
          # 避免又产出一个"看着绿、装上去秒退"的包。
          $verId = $null
          $hdr = $null
          if ($incDir -and (Test-Path -LiteralPath $incDir)) {
              $hdr = Get-ChildItem -LiteralPath $incDir -Recurse -Filter 'mysql_version.h' -ErrorAction SilentlyContinue |
                  Where-Object { -not $_.PSIsContainer } | Select-Object -First 1
          }
          if ($hdr) {
              $hm = [regex]::Match((Get-Content $hdr.FullName -Raw), '(?m)^\s*#define\s+MYSQL_VERSION_ID\s+(\d+)')
              if ($hm.Success) { $verId = [int]$hm.Groups[1].Value }
              Write-Host ("compile-time MYSQL_VERSION_ID = {0}  ({1})" -f $verId, $hdr.FullName)
          }
          if ($verId -and $dllVer) {
              $p = $dllVer.Split('.')
              $dllId = [int]$p[0] * 10000 + [int]$p[1] * 100 + [int]$p[2]
              Write-Host ("runtime libmysql version id  = {0}" -f $dllId)
              if ($dllId -ne $verId) {
                  throw ("libmysql.dll version mismatch: runtime id {0} != compile-time id {1}. " +
                         "该产物在目标机会以 ACE00046 秒退，已阻止打包。") -f $dllId, $verId
              }
              Write-Host 'libmysql.dll version check: OK'
          } else {
              Write-Host '::warning::skipped libmysql version cross-check (could not read MYSQL_VERSION_ID or DLL version)'
          }

          # 2b) 运行期依赖（二）：OpenSSL 3 DLL
          #   AC 的 PE 直接导入 libssl-3-x64/libcrypto-3-x64，缺失则**无任何输出秒退**；
          #   OpenSSLCrypto.cpp 还会断言 legacy.dll 存在（legacy provider）。
          #   这两样 runner 的 MySQL zip 里没有，必须从 OpenSSL 安装目录带出来。
          $osslRoot = $env:OPENSSL_ROOT_DIR
          foreach ($dn in @('libssl-3-x64.dll','libcrypto-3-x64.dll','legacy.dll')) {
              $src = $null
              if ($osslRoot -and (Test-Path -LiteralPath $osslRoot)) {
                  $src = Get-ChildItem -LiteralPath $osslRoot -Recurse -Filter $dn -ErrorAction SilentlyContinue |
                      Where-Object { -not $_.PSIsContainer } | Select-Object -First 1
              }
              if ($src) {
                  Copy-Item -LiteralPath $src.FullName -Destination $dstBin -Force
                  Write-Host ("packaged {0}  <- {1}" -f $dn, $src.FullName)
              } else {
                  Write-Host ("::warning::{0} not found under {1} - 目标机需自行补齐，否则启动无输出秒退" -f $dn, $osslRoot)
              }
          }

          # 3) 配置模板：按 worldserver.conf.dist 反查所在目录（含主配置 + modules/*.conf.dist）
          $confHit = Get-ChildItem $ac -Recurse -Filter 'worldserver.conf.dist' -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\artifacts\\' } | Select-Object -First 1
          if ($confHit) {
              Copy-Into $confHit.DirectoryName (Join-Path $stage 'etc')
              Write-Host ("packaged etc/ from {0} ({1} files)" -f $confHit.DirectoryName, (Get-ChildItem (Join-Path $stage 'etc') -Recurse -File).Count)
          } else { Write-Host '::warning::worldserver.conf.dist not found - deploy.ps1 需要它生成配置' }

          # 4) 数据库初始数据：base + updates（本机 setup_db.ps1 直接导入）
          $sqlBase = Join-Path $ac 'data/sql/base'
          $sqlUpd  = Join-Path $ac 'data/sql/updates'
          if (Test-Path $sqlBase) { Copy-Into $sqlBase (Join-Path $stage 'sql/base');    Write-Host 'packaged sql/base' }
          if (Test-Path $sqlUpd)  { Copy-Into $sqlUpd  (Join-Path $stage 'sql/updates'); Write-Host 'packaged sql/updates' }

          # 5) 模块源码树：保留 data/sql（模块更新器）与 conf（模块配置）
          $mods = Join-Path $ac 'modules'
          if (Test-Path $mods) {
              Copy-Into $mods (Join-Path $stage 'modules')
              Write-Host ("packaged modules/ ({0} files)" -f (Get-ChildItem (Join-Path $stage 'modules') -Recurse -File).Count)
          } else { Write-Host '::warning::no modules/ produced' }

          Get-ChildItem $stage | ForEach-Object { Write-Host ("  stage: {0}" -f $_.Name) }

      - name: Zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:GITHUB_WORKSPACE 'artifacts/AzerothCore-Win64'
          $short = $env:AC_SHA_SHORT
          $zip   = Join-Path $env:GITHUB_WORKSPACE "artifacts/AzerothCore-Win64-$short.zip"
          $sz = @('7z','7zz',"$env:ProgramFiles\7-Zip\7z.exe") |
              Where-Object { $_ -and (Get-Command $_ -ErrorAction SilentlyContinue -CommandType Application) } |
              Select-Object -First 1
          if ($sz) {
              Write-Host "using archiver: $sz"
              Push-Location $stage
              & $sz a -tzip $zip * -r -bso0 -bsp0
              $rc = $LASTEXITCODE
              Pop-Location
              if ($rc -ne 0) { throw "7z failed with $rc" }
          } else {
              Write-Host '7z not found, falling back to Compress-Archive'
              Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $zip -Force
          }
          if (-not (Test-Path $zip)) { throw "zip not produced: $zip" }
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host ("zip: {0} ({1:N1} MB)" -f $zip, ((Get-Item $zip).Length/1MB))

      # 兜底：即使下面的 Release 发布失败，zip 也能从 Actions 产物页直接下载。
      # （本工作区根目录不是 git 仓库——本仓库被 checkout 到 buildrepo/，
      #   AC 被 checkout 到 ac/——所以 gh 无法自动推断仓库，必须显式 --repo。）
      - name: Upload zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AzerothCore-Win64-${{ env.AC_SHA_SHORT }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7
          if-no-files-found: error

      - name: Publish Release (prerelease)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="build-$AC_SHA_SHORT"
          ZIP="$ZIP_PATH"
          echo "publishing $ZIP as $TAG to $GH_REPO"
          # gh 在非 git 目录下无法推断仓库，所有命令都要带 --repo / 走 REST。
          # 同 sha 重跑时清理旧 release/tag，避免 gh release create 撞名失败。
          REL_ID="$(gh api "repos/$GH_REPO/releases/tags/$TAG" --jq .id 2>/dev/null || true)"
          if [ -n "${REL_ID:-}" ]; then
            echo "deleting existing release $TAG (id=$REL_ID)"
            gh api -X DELETE "repos/$GH_REPO/releases/$REL_ID" >/dev/null 2>&1 || true
          fi
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/$TAG" >/dev/null 2>&1 || true
          gh release create "$TAG" "$ZIP" \
            --repo "$GH_REPO" \
            --prerelease \
            --title "AzerothCore build $AC_SHA_SHORT" \
            --notes "AzerothCore master $AC_SHA. Modules per ci/modules.list (static). Download the zip and run deploy.ps1 on Windows."
          echo "RELEASE_TAG=$TAG" >> "$GITHUB_ENV"
          echo "### 产物已发布" >> "$GITHUB_STEP_SUMMARY"
          echo "tag \`$TAG\` — asset \`$(basename "$ZIP")\`" >> "$GITHUB_STEP_SUMMARY"
